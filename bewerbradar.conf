server {
    server_name bewerbradar.de www.bewerbradar.de;

    root /var/www/bewerbradar-landing;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/bewerbradar.de/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/bewerbradar.de/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    server_name studio.bewerbradar.de;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/studio.bewerbradar.de/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/studio.bewerbradar.de/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = bewerbradar.de) {
        return 301 https://$host$request_uri;
    } # managed by Certbot
    if ($host = www.bewerbradar.de) {
        return 301 https://bewerbradar.de$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name bewerbradar.de www.bewerbradar.de;
    return 404; # managed by Certbot
}

server {
    if ($host = studio.bewerbradar.de) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name studio.bewerbradar.de;
    return 404; # managed by Certbot
}